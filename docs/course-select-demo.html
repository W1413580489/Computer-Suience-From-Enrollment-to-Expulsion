<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程选择 Demo V3 · 圆形转盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0c0c; min-height:100vh; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#fff; user-select:none; }
  .bg-stripe { position:fixed; inset:-20%; background:repeating-linear-gradient(-55deg, transparent 0 180px, rgba(255,255,255,.025) 180px 183px); pointer-events:none; }
  .tag { position:fixed; left:0; top:56px; z-index:50; background:#FFF100; color:#111; padding:12px 34px 12px 20px; font-weight:900; clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%); }
  .tag .t1 { font-size:20px; letter-spacing:2px; }
  .tag .t2 { font-size:10px; font-weight:400; letter-spacing:3px; opacity:.7; }
  .tag .num { font-size:46px; line-height:1.1; }
  /* ZZZ 风格异形箭头：左=左向，右=右向 */
  .arrow { position:fixed; top:50%; z-index:60; width:76px; height:66px; background:#0a0a0a; border:2px solid #4a4a4a;
    border-radius: 42% 58% 52% 48% / 58% 42% 58% 42%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .18s; }
  .arrow svg { width:34px; height:34px; fill:#fff; transition:fill .18s; }
  .arrow:hover { background:#FFF100; border-color:#FFF100; transform:scale(1.08); }
  .arrow:hover svg { fill:#111; }
  .arrow.right { right:34px; transform:rotate(-8deg); }
  .arrow.right:hover { transform:rotate(-8deg) scale(1.08); }
  .arrow.left { left:34px; transform:rotate(8deg); }
  .arrow.left:hover { transform:rotate(8deg) scale(1.08); }
  .hint { position:fixed; top:20px; right:24px; z-index:60; font-size:12px; color:#555; }
  .ring { position:fixed; inset:0; }
  .card { position:absolute; left:50%; top:50%; width:300px; height:470px; margin:-235px 0 0 -150px;
    background:#141414; border:1px solid #2b2b2b; border-radius:10px; overflow:hidden; cursor:pointer;
    transition:transform .55s cubic-bezier(.25,.8,.3,1), filter .55s, border-color .3s; will-change:transform; }
  .card.front { cursor:pointer; border-color:#3f3f3f; }
  .card.front:hover { border-color:#FFF100; }
  .deco { position:absolute; inset:0; background:linear-gradient(165deg,#202020 0%,#151515 55%,#111 100%); }
  .deco::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(-55deg, transparent 0 30px, rgba(255,255,255,.045) 30px 34px); clip-path:polygon(52% 0,100% 0,100% 100%,14% 100%); }
  .zz { position:absolute; top:16px; left:16px; z-index:2; font-weight:900; font-size:14px; letter-spacing:1px; color:#999; }
  .bignum { position:absolute; right:-8px; bottom:-34px; z-index:1; font-size:150px; font-weight:900; color:rgba(255,255,255,.05); line-height:1; }
  .card h2 { position:absolute; left:20px; top:70px; z-index:2; font-size:22px; line-height:1.3; font-weight:900; letter-spacing:1px; color:#ccc; }
  .cn { position:absolute; left:20px; top:168px; z-index:2; font-size:13px; color:#888; }
  .desc { position:absolute; left:20px; top:196px; z-index:2; font-size:12px; color:#666; right:18px; }
  .prog { position:absolute; left:20px; bottom:96px; z-index:2; font-size:12px; color:#666; }
  .bar { position:absolute; left:20px; bottom:84px; z-index:2; width:150px; height:3px; background:#2c2c2c; border-radius:2px; }
  .bar i { display:block; height:3px; background:#FFF100; border-radius:2px; }
  .btn { position:absolute; left:20px; bottom:24px; z-index:2; padding:10px 26px; font-size:13px; font-weight:700; letter-spacing:2px; border:0; border-radius:4px; cursor:pointer; background:#2a2a2a; color:#666; }
  .card.front .zz { color:#FFF100; }
  .card.front h2 { font-size:36px; color:#fff; }
  .card.front .cn { font-size:14px; color:#ddd; }
  .card.front .desc { color:#999; }
  .card.front .prog { color:#FFF100; font-weight:700; font-size:13px; }
  .card.front .bar { width:240px; }
  .card.front .deco::after { background:repeating-linear-gradient(-55deg, transparent 0 30px, rgba(255,241,0,.07) 30px 34px); }
  .card.front .btn { background:#FFF100; color:#111; }
  .card.front .btn:hover { transform:scale(1.04); }
  .foot { position:fixed; bottom:22px; left:0; right:0; text-align:center; font-size:12px; color:#666; letter-spacing:4px; z-index:60; }
</style>
</head>
<body>
  <div class="bg-stripe"></div>
  <div class="tag"><div class="t1">课程选择</div><div class="t2">COURSE SELECT</div><div class="num" id="tagNum">02</div></div>
  <button class="arrow left" onclick="move(-1)" title="上一个">
    <svg viewBox="0 0 24 24"><path d="M4 12 L13 4 L13 9 L21 9 L21 15 L13 15 L13 20 Z"/></svg>
  </button>
  <button class="arrow right" onclick="move(1)" title="下一个">
    <svg viewBox="0 0 24 24"><path d="M20 12 L11 4 L11 9 L3 9 L3 15 L11 15 L11 20 Z"/></svg>
  </button>
  <div class="hint">← → 方向键切换 · 点击卡片直接进入 · 回车进入当前课程</div>
  <div class="ring" id="ring"></div>
  <div class="foot">CHOOSE YOUR COURSE · 转动选择你的课程</div>

<script>
const COURSES = [
  { en:"CHATBOT", cn:"套壳聊天机器人", desc:"前端 → 后端 → 大模型 API 的最小闭环", num:"01", prog:5, total:5 },
  { en:"GITHUB AGENT", cn:"GitHub 项目分析", desc:"工具调用 · Agent Loop · 带证据的分析报告", num:"02", prog:3, total:9 },
  { en:"LEARNING AGENT", cn:"个人学习 Agent", desc:"状态管理 · 记忆 · 任务规划（暂未开放）", num:"03", prog:0, total:9, locked:true },
];
let front = 0;
const N = COURSES.length;
const STEP = 360 / N;
let rot = 0;

function build() {
  const ring = document.getElementById("ring");
  ring.innerHTML = "";
  COURSES.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.id = "card" + i;
    const pct = Math.round(c.prog / c.total * 100);
    el.innerHTML = `
      <div class="deco"></div>
      <div class="zz">ZZ·课</div>
      <div class="bignum">${c.num}</div>
      <h2>${c.en}</h2>
      <div class="cn">${c.cn}</div>
      <div class="desc">${c.desc}</div>
      <div class="prog">${c.prog} / ${c.total} ${c.prog === c.total ? "· 已完成" : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <button class="btn" onclick="event.stopPropagation(); enter(${i})">${c.locked ? "即将推出" : (c.prog === c.total ? "重温课程" : (c.prog > 0 ? "继续学习" : "开始学习"))}</button>`;
    // 点击整张卡片 = 直接进入（箭头才负责转动）
    el.onclick = () => enter(i);
    ring.appendChild(el);
  });
  layout();
}

function layout() {
  COURSES.forEach((c, i) => {
    const el = document.getElementById("card" + i);
    const a = ((i - front) * STEP + rot) * Math.PI / 180;
    const RX = Math.min(window.innerWidth * 0.30, 480);
    const RY = 110;
    const x = Math.sin(a) * RX;
    const y = (1 - Math.cos(a)) * RY;
    const depth = (Math.cos(a) + 1) / 2;
    const scale = 0.62 + depth * 0.5;
    const isFront = ((i - front) * STEP + rot) % 360 === 0;
    el.style.transform = `translate(${x}px, ${y}px) scale(${scale.toFixed(3)})`;
    el.style.zIndex = Math.round(depth * 100);
    el.style.filter = `grayscale(${(1 - depth).toFixed(2)}) brightness(${(0.45 + depth * 0.55).toFixed(2)})`;
    el.classList.toggle("front", isFront);
  });
  document.getElementById("tagNum").textContent = COURSES[front].num;
}

function move(d) { rot += d * STEP; front = ((front - d) % N + N) % N; layout(); }
function enter(i) {
  if (COURSES[i].locked) { alert("该课程暂未开放，敬请期待"); return; }
  // 转到该卡片再进入，保留一点转动反馈
  rotateTo(i);
  setTimeout(() => alert("进入课程：" + COURSES[i].cn + "\n（demo 演示：正式版此处进入 AI 导师界面）"), 600);
}
function rotateTo(i) { while (front !== i) move(1); }

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
  if (e.key === "Enter") enter(front);
});
window.addEventListener("resize", layout);

build();
</script>
</body>
</html>
