<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程转盘 Demo · 斜切露图卡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0c0c; min-height:100vh; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#fff; user-select:none; }
  .bg-stripe { position:fixed; inset:-20%; background:repeating-linear-gradient(-55deg, transparent 0 180px, rgba(255,255,255,.025) 180px 183px); pointer-events:none; }
  .tag { position:fixed; left:0; top:56px; z-index:50; background:#FFF100; color:#111; padding:12px 34px 12px 20px; font-weight:900; clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%); }
  .tag .t1 { font-size:20px; letter-spacing:2px; }
  .tag .t2 { font-size:10px; font-weight:400; letter-spacing:3px; opacity:.7; }
  .tag .num { font-size:46px; line-height:1.1; }
  .arrow { position:fixed; top:50%; z-index:60; width:76px; height:66px; background:#0a0a0a; border:2px solid #4a4a4a; border-radius:42% 58% 52% 48% / 58% 42% 58% 42%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .18s; }
  .arrow svg { width:34px; height:34px; fill:#fff; transition:fill .18s; }
  .arrow:hover { background:#FFF100; border-color:#FFF100; transform:scale(1.08); }
  .arrow:hover svg { fill:#111; }
  .arrow.right { right:34px; transform:rotate(-8deg); }
  .arrow.right:hover { transform:rotate(-8deg) scale(1.08); }
  .arrow.left { left:34px; transform:rotate(8deg); }
  .arrow.left:hover { transform:rotate(8deg) scale(1.08); }
  .hint { position:fixed; top:20px; right:24px; z-index:60; font-size:12px; color:#555; }
  .ring { position:fixed; inset:0; }
  .card { position:absolute; left:50%; top:50%; width:300px; height:470px; margin:-235px 0 0 -150px;
    background:#0b0b0b; border:1px solid #3f3f3f; border-radius:10px; overflow:hidden; cursor:pointer;
    transition:transform .55s cubic-bezier(.25,.8,.3,1), filter .55s, border-color .3s; will-change:transform; }
  .card.front:hover { border-color:#FFF100; }
  /* ===== 斜切露图三层结构 ===== */
  .art { position:absolute; inset:0; background:center 30% / cover no-repeat; }
  .mask { position:absolute; inset:0; z-index:2; transition:opacity .35s;
    background:
      linear-gradient(115deg, #0b0b0b 0 40%, transparent 40%),
      linear-gradient(115deg, transparent 0 74%, #0b0b0b 74%); }
  .lines { position:absolute; inset:0; z-index:1; transition:opacity .35s;
    background:repeating-linear-gradient(115deg, transparent 0 110px, rgba(255,255,255,.75) 110px 113px); }
  /* 悬停：黑遮罩与细线淡出，露出完整图片 */
  .card.front:hover .mask, .card.front:hover .lines { opacity:0; }
  .zz { position:absolute; top:16px; left:16px; z-index:3; font-weight:900; font-size:14px; letter-spacing:1px; color:#999; }
  .card.front .zz { color:#FFF100; }
  .bignum { position:absolute; right:-8px; bottom:-34px; z-index:1; font-size:150px; font-weight:900; color:rgba(255,255,255,.06); line-height:1; }
  .card h2 { position:absolute; left:20px; top:26px; z-index:3; font-size:22px; line-height:1.3; font-weight:900; letter-spacing:1px; color:#ccc; }
  .card.front h2 { font-size:30px; color:#fff; }
  .cn { position:absolute; left:20px; top:88px; z-index:3; font-size:13px; font-weight:700; letter-spacing:4px; color:#FFF100; }
  .desc { position:absolute; left:20px; bottom:96px; z-index:3; font-size:12px; color:#f2f2f2; text-shadow:0 1px 4px rgba(0,0,0,.95); right:18px; display:none; }
  .card.front .desc { display:block; }
  .prog { position:absolute; left:20px; bottom:76px; z-index:3; font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.95); display:none; }
  .card.front .prog { display:block; }
  .bar { position:absolute; left:20px; bottom:62px; z-index:3; width:240px; height:4px; background:rgba(255,255,255,.18); border-radius:2px; display:none; }
  .card.front .bar { display:block; }
  .bar i { display:block; height:4px; background:#FFF100; border-radius:2px; }
  .btn { position:absolute; left:20px; bottom:22px; z-index:3; padding:10px 26px; font-size:13px; font-weight:700; letter-spacing:2px; border:0; border-radius:4px; cursor:pointer; background:#2a2a2a; color:#666; display:none; }
  .card.front .btn { display:inline-block; background:#FFF100; color:#111; }
  .card.front .btn:hover { transform:scale(1.04); }
  .card.locked .btn { display:inline-block; background:#222; color:#777; cursor:default; }
  .foot { position:fixed; bottom:22px; left:0; right:0; text-align:center; font-size:12px; color:#666; letter-spacing:4px; z-index:60; }
</style>
</head>
<body>
  <div class="bg-stripe"></div>
  <div class="tag"><div class="t1">课程选择</div><div class="t2">COURSE SELECT</div><div class="num" id="tagNum">01</div></div>
  <button class="arrow left" onclick="move(-1)"><svg viewBox="0 0 24 24"><path d="M4 12 L13 4 L13 9 L21 9 L21 15 L13 15 L13 20 Z"/></svg></button>
  <button class="arrow right" onclick="move(1)"><svg viewBox="0 0 24 24"><path d="M20 12 L11 4 L11 9 L3 9 L3 15 L11 15 L11 20 Z"/></svg></button>
  <div class="hint">← → 方向键切换 · 点击卡片直接进入 · 回车进入当前课程</div>
  <div class="ring" id="ring"></div>
  <div class="foot">CHOOSE YOUR COURSE · 转动选择你的课程</div>

<script>
const COURSES = [
  { en:"CHATBOT", cn:"套壳聊天机器人", desc:"前端 → 后端 → 大模型 API 的最小闭环", num:"01", img:"wheel-chatbot.jpg", pos:"center 30%", prog:5, total:5, posOverride:"center 25%" },
  { en:"GITHUB AGENT", cn:"GitHub 项目分析", desc:"工具调用 · Agent Loop · 带证据的分析报告", num:"02", img:"wheel-agent.jpg", pos:"center 30%", prog:3, total:9 },
  { en:"MORE", cn:"更多课程", desc:"个人学习 Agent · 敬请期待", num:"03", img:"wheel-more.jpg", pos:"86% 40%", prog:0, total:0, locked:true },
];
let front = 0;
const N = COURSES.length;
const STEP = 360 / N;
let rot = 0;

function build() {
  const ring = document.getElementById("ring");
  ring.innerHTML = "";
  COURSES.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "card" + (c.locked ? " locked" : "");
    el.id = "card" + i;
    const pct = c.total ? Math.round(c.prog / c.total * 100) : 0;
    el.innerHTML = `
      <div class="art" style="background-image:url('${c.img}'); background-position:${c.posOverride || c.pos};"></div>
      <div class="lines"></div>
      <div class="mask"></div>
      <div class="zz">ZZ·课</div>
      <div class="bignum">${c.num}</div>
      <h2>${c.en}</h2>
      <div class="cn">${c.cn}</div>
      <div class="desc">${c.desc}</div>
      <div class="prog">${c.prog} / ${c.total} ${c.total && c.prog === c.total ? "· 已完成" : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <button class="btn" onclick="event.stopPropagation(); enter(${i})">${c.locked ? "敬请期待" : (c.prog === c.total ? "重温课程" : (c.prog > 0 ? "继续学习" : "开始学习"))}</button>`;
    el.onclick = () => enter(i);
    ring.appendChild(el);
  });
  layout();
}

function layout() {
  COURSES.forEach((c, i) => {
    const el = document.getElementById("card" + i);
    const a = ((i - front) * STEP + rot) * Math.PI / 180;
    const RX = Math.min(window.innerWidth * 0.30, 480);
    const x = Math.round(Math.sin(a) * RX);
    const y = Math.round((1 - Math.cos(a)) * 110);
    const depth = (Math.cos(a) + 1) / 2;
    const scale = 0.62 + depth * 0.5;
    const isFront = ((i - front) * STEP + rot) % 360 === 0;
    el.style.transform = `translate(${x}px, ${y}px) scale(${scale.toFixed(3)})`;
    el.style.zIndex = Math.round(depth * 100);
    // 侧位卡片：降亮度但保底可见（露图带在侧位也隐约可辨）
    el.style.filter = `grayscale(${(0.55 * (1 - depth)).toFixed(2)}) brightness(${(0.5 + depth * 0.5).toFixed(2)})`;
    el.classList.toggle("front", isFront);
  });
  document.getElementById("tagNum").textContent = COURSES[front].num;
}

function move(d) { rot += d * STEP; front = ((front - d) % N + N) % N; layout(); }
function enter(i) {
  if (COURSES[i].locked) { alert("该课程暂未开放，敬请期待"); return; }
  rotateTo(i);
  setTimeout(() => alert("进入课程：" + COURSES[i].cn + "\n（demo 演示：正式版此处进入 AI 导师界面）"), 600);
}
function rotateTo(i) { while (front !== i) move(1); }

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
  if (e.key === "Enter") enter(front);
});
window.addEventListener("resize", layout);

build();
</script>
</body>
</html>
