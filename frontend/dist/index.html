<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="信科助手" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>信科院智能助手 · INFO SYSTEM</title>
    <!-- ZZZ 字体：Bebas Neue + Noto Sans SC / AK 字体：Noto Serif SC（明日方舟日间衬线标题） -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <!--
      字体样式表改为「非阻塞」加载。
      原因：这份 CSS 体积极大（中文字体按 unicode-range 被切成上百个分片，实测约 430KB，
      外网 TTFB 0.7~3.2s、总耗时可达 6.5s）。用普通 <link rel="stylesheet"> 会阻塞首屏渲染，
      表现就是"页面要等一段时间才显现"。改为 preload + onload 切换后，首屏立即用系统字体渲染
      （--font-body 的回退链已有 PingFang SC / Microsoft YaHei），字体到位后自动替换，不影响观感。
    -->
    <link
      rel="preload" as="style"
      href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;500;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;500;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap">
    </noscript>
    <!-- 自托管字体（JetBrains Mono 本地回退） -->
    <script>
      // 提前应用持久化主题，避免首屏主题闪烁（zzz=绝区零夜/ak=明日方舟日）
      (function () {
        try {
          var m = localStorage.getItem('xkz_theme_v1');
          document.documentElement.setAttribute('data-theme', m === 'ak' ? 'ak' : 'zzz');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'zzz');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-By4j8Gjd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cji6NBZz.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
